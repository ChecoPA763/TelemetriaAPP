name: Compilar APK Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: Crear APK debug
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar herramientas del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: Compilar la APK
        working-directory: app
        run: |
          buildozer android debug

      - name: Guardar la APK
        uses: actions/upload-artifact@v7
        with:
          name: lobos-telemetria-v1.1.1-debug
          path: app/bin/*.apk
          if-no-files-found: error
          retention-days: 14

