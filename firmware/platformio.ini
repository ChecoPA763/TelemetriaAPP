[platformio]
default_envs = esp32_principal
src_dir = .
lib_dir = libraries

[env:esp32_principal]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit MLX90614 Library@^2.1.5
    knolleary/PubSubClient@^2.8
build_src_filter =
    -<*>
    +<esp32_principal/*.cpp>

[env:rp2040_interfaz]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino@^1.5.6
    dfrobot/DFRobotDFPlayerMini@^1.0.6
build_src_filter =
    -<*>
    +<rp2040_interfaz/*.cpp>

; El código Daly aportado fue probado con Arduino-ESP32 3.3.10. La placa exacta
; del Super Mini puede requerir cambiar board sin tocar el firmware.
[env:esp32_c6_bms]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<esp32_c6_bms/*.cpp>

